name: CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: LQ Grade 4 Question Audit
        run: npm run audit:lq

      - name: Brain Training Grade 4 Question Audit
        run: npm run audit:brain

      - name: Run Tests
        run: npm test

      - name: Build
        run: npm run build
