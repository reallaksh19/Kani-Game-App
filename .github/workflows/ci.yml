name: CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kani
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Read locked Study-Hub SHA
        id: contract-lock
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(node -e "const fs=require('fs'); process.stdout.write(JSON.parse(fs.readFileSync('integration/upstream.lock.json','utf8')).sourceCommit)")" >> "$GITHUB_OUTPUT"

      - name: Checkout Study-Hub contract authority at locked SHA
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Study-Hub
          ref: ${{ steps.contract-lock.outputs.sha }}
          path: .contract-source

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Verify immutable Study-Hub contract lock
        env:
          KANI_CONTRACT_SOURCE_DIR: ${{ github.workspace }}/.contract-source
        run: npm run audit:contracts

      - name: Architecture Anti-Drift Audit
        run: npm run audit:architecture

      - name: Type Check
        run: npx tsc --noEmit

      - name: LQ Grade 4 Question Audit
        run: npm run audit:lq

      - name: Brain Training Grade 4 Question Audit
        run: npm run audit:brain

      - name: Authenticated Backend Schema Audit
        run: npm run audit:backend

      - name: Stage 6 Verification Harness Audit
        run: npm run audit:staging-harness

      - name: Deno Check Learner API
        run: deno check --config supabase/functions/deno.json supabase/functions/kani-api/index.ts

      - name: Run Tests
        run: npm test

      - name: Build
        run: npm run build
